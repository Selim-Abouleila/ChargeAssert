bundle:
  name: chargeassert
  databricks_cli_version: ">= 0.295.0"
  engine: direct

include:
  - resources/*.yml

sync:
  include:
    - data/ingestion_demo/*.jsonl
    # The generated evaluator reads these files from the deployed workspace.
    - sql/generated/*.sql

variables:
  catalog_name:
    description: Existing Unity Catalog catalog that will contain the ChargeAssert layers.
    default: workspace

  warehouse_id:
    description: Existing SQL warehouse used to run ChargeAssert SQL tasks.
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
