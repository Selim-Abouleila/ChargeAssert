resources:
  volumes:
    ocpp_ingestion:
      catalog_name: ${var.catalog_name}
      schema_name: ${resources.schemas.bronze.name}
      name: ocpp_ingestion
      volume_type: MANAGED
      comment: Immutable OCPP demo files and persistent Auto Loader checkpoints.
      lifecycle:
        prevent_destroy: true

  jobs:
    generate_sessions:
      name: chargeassert_dev_generate_sessions
      description: Generate one repeatable synthetic charging-session file; publish once and stop.
      max_concurrent_runs: 1
      parameters:
        - name: batch_id
          default: sessions-001
        - name: session_count
          default: "2"
        - name: seed
          default: "42"
      tasks:
        - task_key: generate_batch
          notebook_task:
            notebook_path: ../notebooks/generate_sessions.py
            base_parameters:
              input_path: /Volumes/${var.catalog_name}/${resources.schemas.bronze.name}/${resources.volumes.ocpp_ingestion.name}/incoming
              batch_id: "{{job.parameters.batch_id}}"
              session_count: "{{job.parameters.session_count}}"
              seed: "{{job.parameters.seed}}"

    publish_ingestion_demo:
      name: chargeassert_dev_publish_ingestion_demo
      description: Publish one immutable synthetic OCPP JSON-lines batch; identical publication is a no-op.
      max_concurrent_runs: 1
      parameters:
        - name: batch
          default: batch_001
      tasks:
        - task_key: publish_batch
          notebook_task:
            notebook_path: ../notebooks/publish_ingestion_demo.py
            base_parameters:
              input_path: /Volumes/${var.catalog_name}/${resources.schemas.bronze.name}/${resources.volumes.ocpp_ingestion.name}/incoming
              batch: "{{job.parameters.batch}}"

    ingest_ocpp_files:
      name: chargeassert_dev_ingest_ocpp_files
      description: Append newly discovered OCPP JSON lines and file metadata to Bronze using a persistent Auto Loader checkpoint.
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_files
          notebook_task:
            notebook_path: ../notebooks/ingest_ocpp_files.py
            base_parameters:
              input_path: /Volumes/${var.catalog_name}/${resources.schemas.bronze.name}/${resources.volumes.ocpp_ingestion.name}/incoming
              checkpoint_path: /Volumes/${var.catalog_name}/${resources.schemas.bronze.name}/${resources.volumes.ocpp_ingestion.name}/checkpoints/ocpp_v1
              table_name: ${var.catalog_name}.${resources.schemas.bronze.name}.ocpp_events_landing

    combined_ingestion:
      name: chargeassert_dev_combined_ingestion
      description: Run the existing generation and ingestion jobs in order.
      max_concurrent_runs: 1
      parameters:
        - name: batch_id
          default: sessions-001
        - name: session_count
          default: "2"
        - name: seed
          default: "42"
      tasks:
        - task_key: generate_sessions
          run_job_task:
            job_id: ${resources.jobs.generate_sessions.id}
            job_parameters:
              batch_id: "{{job.parameters.batch_id}}"
              session_count: "{{job.parameters.session_count}}"
              seed: "{{job.parameters.seed}}"

        - task_key: ingest_ocpp_files
          depends_on:
            - task_key: generate_sessions
          run_if: ALL_SUCCESS
          # Reuse the child job's concurrency limit for every checkpoint writer.
          run_job_task:
            job_id: ${resources.jobs.ingest_ocpp_files.id}
