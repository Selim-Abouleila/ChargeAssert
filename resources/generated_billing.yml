resources:
  jobs:
    evaluate_generated_batch:
      name: chargeassert_dev_evaluate_generated_batch
      description: Validate a complete generated batch, compare independent charges with both billing mocks, and save Gold evidence.
      max_concurrent_runs: 1
      parameters:
        - name: batch_id
          default: sessions-repaired-001
        - name: candidate_mode
          default: healthy
      tasks:
        - task_key: evaluate_batch
          notebook_task:
            notebook_path: ../notebooks/evaluate_generated_batch.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              batch_id: "{{job.parameters.batch_id}}"
              candidate_mode: "{{job.parameters.candidate_mode}}"
              job_id: "{{job.id}}"
              job_run_id: "{{job.run_id}}"
              repair_count: "{{job.repair_count}}"

        - task_key: refresh_dashboard
          depends_on:
            - task_key: evaluate_batch
          # Billing FAIL still completes evaluation; processing errors skip refresh.
          run_if: ALL_SUCCESS
          dashboard_task:
            dashboard_id: ${resources.dashboards.generated_billing.id}
            warehouse_id: ${var.warehouse_id}
            filters:
              "filters~execution_id": "{{tasks.evaluate_batch.values.execution_id}}"

    run_generated_pipeline:
      name: chargeassert_dev_run_generated_pipeline
      description: Generate one batch, load its events and check its bills through Gold.
      max_concurrent_runs: 1
      parameters:
        # One name for this parent run, shared by generation and evaluation.
        - name: batch_id
          default: "sessions-{{job.run_id}}"
        - name: session_count
          default: "100"
        - name: seed
          default: "42"
        - name: candidate_mode
          default: amount_error
      tasks:
        - task_key: generate_sessions
          run_job_task:
            job_id: ${resources.jobs.generate_sessions.id}
            job_parameters:
              batch_id: "{{job.parameters.batch_id}}"
              session_count: "{{job.parameters.session_count}}"
              seed: "{{job.parameters.seed}}"

        - task_key: ingest_ocpp_files
          depends_on:
            - task_key: generate_sessions
          run_if: ALL_SUCCESS
          # Reuse the one ingestion job that owns the Auto Loader checkpoint.
          run_job_task:
            job_id: ${resources.jobs.ingest_ocpp_files.id}

        - task_key: evaluate_generated_batch
          depends_on:
            - task_key: ingest_ocpp_files
          run_if: ALL_SUCCESS
          # The child job keeps its own execution identity and saved Gold result.
          run_job_task:
            job_id: ${resources.jobs.evaluate_generated_batch.id}
            job_parameters:
              batch_id: "{{job.parameters.batch_id}}"
              candidate_mode: "{{job.parameters.candidate_mode}}"
