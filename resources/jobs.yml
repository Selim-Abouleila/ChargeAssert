resources:
  jobs:
    create_tables:
      name: chargeassert_dev_create_tables
      description: Creates and verifies the foundational ChargeAssert Bronze, Silver and Gold tables.
      tasks:
        - task_key: create_run_manifest
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/01_create_run_manifest.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_bronze.run_manifest

        - task_key: create_ocpp_transaction_events_raw
          depends_on:
            - task_key: create_run_manifest
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/02_create_ocpp_transaction_events_raw.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_bronze.ocpp_transaction_events_raw
              run_manifest_table_name: ${var.catalog_name}.chargeassert_dev_bronze.run_manifest

        - task_key: create_session_lifecycle
          depends_on:
            - task_key: create_ocpp_transaction_events_raw
            - task_key: seed_amount_scenarios
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/03_create_session_lifecycle.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_silver.session_lifecycle
              raw_events_table_name: ${var.catalog_name}.chargeassert_dev_bronze.ocpp_transaction_events_raw

        - task_key: create_tariffs_raw
          depends_on:
            - task_key: create_run_manifest
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/04_create_tariffs_raw.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_bronze.tariffs_raw

        - task_key: create_tariff_history
          depends_on:
            - task_key: create_tariffs_raw
            - task_key: seed_amount_scenarios
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/05_create_tariff_history.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_silver.tariff_history
              raw_tariffs_table_name: ${var.catalog_name}.chargeassert_dev_bronze.tariffs_raw

        - task_key: create_expected_ledger
          depends_on:
            - task_key: create_session_lifecycle
            - task_key: create_tariff_history
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/06_create_expected_ledger.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_silver.expected_ledger
              session_lifecycle_table_name: ${var.catalog_name}.chargeassert_dev_silver.session_lifecycle
              tariff_history_table_name: ${var.catalog_name}.chargeassert_dev_silver.tariff_history

        - task_key: create_ocpi_cdrs_raw
          depends_on:
            - task_key: create_run_manifest
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/07_create_ocpi_cdrs_raw.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_bronze.ocpi_cdrs_raw
              run_manifest_table_name: ${var.catalog_name}.chargeassert_dev_bronze.run_manifest

        - task_key: seed_amount_scenarios
          depends_on:
            - task_key: create_ocpp_transaction_events_raw
            - task_key: create_tariffs_raw
            - task_key: create_ocpi_cdrs_raw
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/11_seed_amount_scenarios.sql
            parameters:
              run_manifest_table_name: ${var.catalog_name}.chargeassert_dev_bronze.run_manifest
              raw_events_table_name: ${var.catalog_name}.chargeassert_dev_bronze.ocpp_transaction_events_raw
              raw_tariffs_table_name: ${var.catalog_name}.chargeassert_dev_bronze.tariffs_raw
              raw_cdrs_table_name: ${var.catalog_name}.chargeassert_dev_bronze.ocpi_cdrs_raw

        - task_key: create_actual_ledger
          depends_on:
            - task_key: create_ocpi_cdrs_raw
            - task_key: seed_amount_scenarios
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/08_create_actual_ledger.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_silver.actual_ledger
              raw_cdrs_table_name: ${var.catalog_name}.chargeassert_dev_bronze.ocpi_cdrs_raw

        - task_key: create_assertion_result
          depends_on:
            - task_key: create_expected_ledger
            - task_key: create_actual_ledger
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/09_create_assertion_result.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_gold.assertion_result
              expected_ledger_table_name: ${var.catalog_name}.chargeassert_dev_silver.expected_ledger
              actual_ledger_table_name: ${var.catalog_name}.chargeassert_dev_silver.actual_ledger
              session_lifecycle_table_name: ${var.catalog_name}.chargeassert_dev_silver.session_lifecycle

        - task_key: create_release_verdict
          depends_on:
            - task_key: create_assertion_result
          run_if: ALL_SUCCESS
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../sql/10_create_release_verdict.sql
            parameters:
              table_name: ${var.catalog_name}.chargeassert_dev_gold.release_verdict
              run_manifest_table_name: ${var.catalog_name}.chargeassert_dev_bronze.run_manifest
              assertion_result_table_name: ${var.catalog_name}.chargeassert_dev_gold.assertion_result
              expected_ledger_table_name: ${var.catalog_name}.chargeassert_dev_silver.expected_ledger
              session_lifecycle_table_name: ${var.catalog_name}.chargeassert_dev_silver.session_lifecycle
              actual_ledger_table_name: ${var.catalog_name}.chargeassert_dev_silver.actual_ledger
